name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (HA ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: stabil
            pre: ""
          - ha: beta
            pre: "--pre"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Home Assistant + Testumgebung installieren
        run: |
          python -m pip install --upgrade pip
          pip install ${{ matrix.pre }} pytest-homeassistant-custom-component pytest-github-actions-annotate-failures
          python -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"
      - name: Tests
        run: pytest -v
