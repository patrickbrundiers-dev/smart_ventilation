name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (HA ${{ matrix.ha }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.dev == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: stabil
            pre: ""
          - ha: beta
            pre: "--pre"
          - ha: dev
            pre: ""
            dev: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Home Assistant + Testumgebung installieren
        run: |
          python -m pip install --upgrade pip
          pip install ${{ matrix.pre }} pytest-homeassistant-custom-component pytest-github-actions-annotate-failures
          if [ "${{ matrix.dev }}" = "true" ]; then
            # Entwicklungsversion von HA über die stabile Testumgebung legen (z. B. für den Wechsel auf probatio)
            git clone -q --depth 1 -b dev https://github.com/home-assistant/core /tmp/core
            pip install -q -r /tmp/core/requirements.txt
            pip install -q --no-deps /tmp/core
          fi
          echo "::notice title=Version::Home Assistant $(python -c 'import homeassistant.const as c; print(c.__version__)')"
      - name: Tests
        run: |
          set -o pipefail
          pytest -v 2>&1 | tee pytest.log
      - name: Ergebnis
        if: always()
        run: echo "::notice title=Ergebnis::$(tail -n 1 pytest.log)"
