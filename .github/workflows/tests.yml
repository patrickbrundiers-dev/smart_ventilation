name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (HA ${{ matrix.ha }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.dev == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: stabil
            pre: ""
          - ha: beta
            pre: "--pre"
          - ha: dev
            pre: ""
            dev: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Home Assistant + Testumgebung installieren
        run: |
          python -m pip install --upgrade pip
          pip install ${{ matrix.pre }} pytest-homeassistant-custom-component pytest-github-actions-annotate-failures
          if [ "${{ matrix.dev }}" = "true" ]; then
            # Entwicklungsversion von HA über die stabile Testumgebung legen (z. B. für den Wechsel auf probatio)
            git clone -q --depth 1 -b dev https://github.com/home-assistant/core /tmp/core
            pip install -q -r /tmp/core/requirements.txt
            pip install -q --no-deps /tmp/core
          fi
          echo "::notice title=Version::Home Assistant $(python -c 'import homeassistant.const as c; print(c.__version__)')"
      - name: Tests
        run: |
          set -o pipefail
          pytest -v -rf --tb=short 2>&1 | tee pytest.log
      - name: Ergebnis
        if: always()
        run: |
          echo "::notice title=Ergebnis::$(tail -n 1 pytest.log)"
          grep -E "^(FAILED|ERROR) " pytest.log | while read -r line; do echo "::error title=Test::${line:0:900}"; done || true
          grep -E "^E  " pytest.log | head -n 15 | while read -r line; do echo "::error title=Detail::${line:0:900}"; done || true
          python3 - <<'PYEOF' || true
          import re

          ANSI = re.compile(r"\x1b\[[0-9;]*m")

          with open("pytest.log", encoding="utf-8", errors="replace") as f:
              raw_lines = [ANSI.sub("", l).rstrip("\n") for l in f.readlines()]

          def is_divider(s: str) -> bool:
              s = s.strip()
              if len(s) < 10:
                  return False
              core = s.strip("_= ")
              # Trennzeile: fast nur aus "_" oder "=" bestehend (Testname optional in der Mitte).
              symbol_count = sum(1 for c in s if c in "_=")
              return symbol_count >= max(10, len(s) - len(core) - 2)

          # Bloecke an Trennzeilen aufteilen (funktioniert fuer "____ test_x ____" wie auch fuer
          # "==== FAILURES ====" - beide Formate zaehlen als Trennzeile).
          blocks = []
          current = []
          for line in raw_lines:
              if is_divider(line):
                  if current:
                      blocks.append(current)
                  current = [line]
              else:
                  current.append(line)
          if current:
              blocks.append(current)

          def block_text(b):
              return "\n".join(b)

          def looks_like_traceback(b):
              text = block_text(b)
              return bool(re.search(r"^\s*E\s", text, re.M) or re.search(r"^\s*>", text, re.M) or "Error" in text or "Exception" in text)

          error_blocks = [b for b in blocks if re.search(r"ERROR at (setup|teardown) of", block_text(b))]
          fail_blocks = [
              b for b in blocks
              if b not in error_blocks
              and len(b) > 1
              and "PASSED" not in block_text(b)
              and "test session starts" not in block_text(b)
              and looks_like_traceback(b)
          ]

          picked = error_blocks[:2] + fail_blocks[:3]
          total = 0
          if not picked:
              # Fallback: falls die Blockerkennung nichts findet, wenigstens rohe Zeilen rund um
              # die ersten FAILED/ERROR-Marker aus der Kurzzusammenfassung ausgeben.
              for i, line in enumerate(raw_lines):
                  if line.startswith(("FAILED ", "ERROR ")):
                      for ctx in raw_lines[max(0, i - 20):i + 1]:
                          if ctx.strip():
                              print(f"::error title=Fallback::{ctx[:500]}")
                      break
          else:
              for block in picked:
                  for line in block:
                      if not line.strip():
                          continue
                      total += 1
                      if total > 150:
                          break
                      print(f"::error title=Trace::{line[:500]}")
                  if total > 150:
                      break
          PYEOF
