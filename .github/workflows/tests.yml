name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (HA ${{ matrix.ha }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.dev == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: stabil
            pre: ""
          - ha: beta
            pre: "--pre"
          - ha: dev
            pre: ""
            dev: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Home Assistant + Testumgebung installieren
        run: |
          python -m pip install --upgrade pip
          pip install ${{ matrix.pre }} pytest-homeassistant-custom-component pytest-github-actions-annotate-failures
          if [ "${{ matrix.dev }}" = "true" ]; then
            # Entwicklungsversion von HA über die stabile Testumgebung legen (z. B. für den Wechsel auf probatio)
            git clone -q --depth 1 -b dev https://github.com/home-assistant/core /tmp/core
            pip install -q -r /tmp/core/requirements.txt
            pip install -q --no-deps /tmp/core
          fi
          echo "::notice title=Version::Home Assistant $(python -c 'import homeassistant.const as c; print(c.__version__)')"
      - name: Tests
        run: |
          set -o pipefail
          pytest -v -rf --tb=short 2>&1 | tee pytest.log
      - name: Ergebnis
        if: always()
        run: |
          echo "::notice title=Ergebnis::$(tail -n 1 pytest.log)"
          grep -E "^(FAILED|ERROR) " pytest.log | while read -r line; do echo "::error title=Test::${line:0:900}"; done || true
          grep -E "^E  " pytest.log | head -n 15 | while read -r line; do echo "::error title=Detail::${line:0:900}"; done || true
          python3 - <<'PYEOF' || true
          import re

          with open("pytest.log", encoding="utf-8", errors="replace") as f:
              lines = f.readlines()

          # Kompakte Traceback-Bloecke (--tb=short) sind durch Trennzeilen wie
          # "________ ERROR at setup of test_x ________" oder
          # "________ test_x ________" abgegrenzt. Fuer die ersten paar Bloecke
          # jeweils den vollen Inhalt als Annotation ausgeben, da die einfachen
          # FAILED/ERROR-Zeilen und "E  "-Greps offenbar nicht genug Kontext liefern.
          divider = re.compile(r"^_{5,}.*_{5,}$")
          blocks = []
          current = None
          for line in lines:
              line = line.rstrip("\n")
              if divider.match(line):
                  if current is not None:
                      blocks.append(current)
                  current = [line]
              elif current is not None:
                  if line.startswith("="):
                      blocks.append(current)
                      current = None
                  else:
                      current.append(line)
          if current is not None:
              blocks.append(current)

          error_blocks = [b for b in blocks if "ERROR at setup" in b[0] or "ERROR at teardown" in b[0]]
          fail_blocks = [b for b in blocks if b not in error_blocks]

          picked = error_blocks[:2] + fail_blocks[:2]
          total = 0
          for block in picked:
              for line in block:
                  if not line.strip():
                      continue
                  total += 1
                  if total > 120:
                      break
                  print(f"::error title=Trace::{line[:500]}")
              if total > 120:
                  break
          PYEOF
